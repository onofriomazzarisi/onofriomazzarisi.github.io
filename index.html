<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onofrio Mazzarisi</title>
  <meta name="description" content="Onofrio Mazzarisi, Chargé de Recherche at CNRS, Montpellier, France. Theoretical physicist working on quantitative biology, community ecology and evolutionary theory.">
  <link rel="canonical" href="https://onofriomazzarisi.github.io/">
  <meta property="og:title" content="Onofrio Mazzarisi">
  <meta property="og:description" content="Chargé de Recherche at CNRS, Montpellier, France">
  <meta property="og:url" content="https://onofriomazzarisi.github.io/">
  <meta property="og:image" content="https://onofriomazzarisi.github.io/images/profile-gree2.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --bg: #ffffff;
      --text: #3d4144;
      --muted: #7a8288;
      --border: #f2f3f3;
      --link: #2f7f93;
      --link-hover: #1f5563;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1d1f;
        --text: #e3e5e7;
        --muted: #9aa1a7;
        --border: #2c2f32;
        --link: #6cbfd3;
        --link-hover: #9fd8e6;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover, a:focus { color: var(--link-hover); text-decoration: underline; }

    .masthead {
      border-bottom: 1px solid var(--border);
      padding: 1em 16px;
    }
    .masthead__inner {
      max-width: 1100px;
      margin: 0 auto;
      font-weight: 700;
      font-size: 1.15em;
    }
    .masthead__inner a { color: var(--text); }

    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2em 16px;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 3em;
    }

    .sidebar { font-size: 0.9em; }
    .avatar {
      display: block;
      width: 100%;
      max-width: 175px;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid var(--border);
    }
    .author__name { margin: 0.8em 0 0.1em; font-size: 1.25em; }
    .author__bio { margin: 0 0 1em; color: var(--muted); }
    .author__urls { list-style: none; margin: 0; padding: 0; }
    .author__urls li { margin: 0 0 0.45em; white-space: nowrap; }
    .author__urls i { width: 1.4em; text-align: center; margin-right: 0.3em; color: var(--muted); }
    .author__urls a { color: var(--text); }
    .author__urls a:hover { color: var(--link); }

    .content {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
    }
    .content h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(1.6em, 4vw, 2.4em);
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .footer {
      border-top: 1px solid var(--border);
      padding: 1.5em 16px;
      text-align: center;
      font-size: 0.8em;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .main { grid-template-columns: minmax(0, 1fr); gap: 1.5em; }
      .sidebar {
        display: grid;
        grid-template-columns: 90px minmax(0, 1fr);
        column-gap: 1em;
      }
      .avatar { max-width: 90px; grid-row: span 2; align-self: center; }
      .author__name { margin: 0; align-self: end; }
      .author__bio { margin: 0; align-self: start; }
      .author__urls {
        grid-column: 1 / -1;
        margin-top: 1em;
        display: flex;
        flex-wrap: wrap;
        gap: 0.3em 1.2em;
      }
      .content { min-height: 30vh; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead__inner"><a href="/">Onofrio Mazzarisi</a></div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <img class="avatar" src="images/profile-gree2.jpg" alt="Onofrio Mazzarisi">
      <h3 class="author__name">Onofrio Mazzarisi</h3>
      <p class="author__bio">Chargé de Recherche at CNRS</p>
      <ul class="author__urls">
        <li><i class="fa-solid fa-location-dot" aria-hidden="true"></i>Montpellier, France</li>
        <li>
          <i class="fa-solid fa-envelope" aria-hidden="true"></i><a href="#" id="email-link" data-u="isirazzam.oirfono" data-d="rf.srnc">Email</a>
          <noscript>onofrio.mazzarisi [at] cnrs [dot] fr</noscript>
        </li>
        <li><i class="fa-brands fa-github" aria-hidden="true"></i><a href="https://github.com/onofriomazzarisi">GitHub</a></li>
        <li><i class="fa-brands fa-google-scholar" aria-hidden="true"></i><a href="https://scholar.google.com/citations?user=G1WQQN4AAAAJ&amp;hl=en">Google Scholar</a></li>
        <li><i class="fa-brands fa-orcid" aria-hidden="true"></i><a href="https://orcid.org/0000-0002-0234-3723">ORCID</a></li>
      </ul>
    </aside>

    <main class="content">
      <h1>Under renovation&hellip;</h1>
    </main>
  </div>

  <footer class="footer">&copy; <span id="year">2026</span> Onofrio Mazzarisi</footer>

  <script>
    // The address is stored reversed and split, so it never appears in the page source.
    // It is assembled only when someone actually interacts with the link.
    (function () {
      var a = document.getElementById('email-link');
      var rev = function (s) { return s.split('').reverse().join(''); };
      var addr = function () { return rev(a.dataset.u) + String.fromCharCode(64) + rev(a.dataset.d); };
      var arm = function () { a.href = 'mailto:' + addr(); };
      a.addEventListener('mouseenter', arm);
      a.addEventListener('focus', arm);
      a.addEventListener('touchstart', arm, { passive: true });
      a.addEventListener('click', arm);
      a.title = 'Send an email';
      document.getElementById('year').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
